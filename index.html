<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Labor Percentage Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }
        
        .header p {
            opacity: 0.9;
            font-size: 14px;
        }
        
        .form-section {
            padding: 30px;
        }
        
        .form-group {
            margin-bottom: 24px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }
        
        select, input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s;
            background: white;
        }
        
        select:focus, input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        input[type="number"] {
            font-family: 'Courier New', monospace;
        }
        
        .store-selector {
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 16px;
            max-height: 400px;
            overflow-y: auto;
        }
        
        .district-section {
            margin-bottom: 20px;
        }
        
        .district-section:last-child {
            margin-bottom: 0;
        }
        
        .district-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            padding: 8px;
            background: #f8f9fa;
            border-radius: 6px;
            cursor: pointer;
            user-select: none;
        }
        
        .district-header:hover {
            background: #e9ecef;
        }
        
        .district-checkbox {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        
        .district-name {
            font-weight: 700;
            color: #667eea;
            font-size: 15px;
        }
        
        .store-list {
            margin-left: 28px;
            display: grid;
            gap: 8px;
        }
        
        .store-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px;
            cursor: pointer;
            border-radius: 4px;
            transition: background 0.2s;
        }
        
        .store-item:hover {
            background: #f8f9fa;
        }
        
        .store-checkbox {
            width: 16px;
            height: 16px;
            cursor: pointer;
        }
        
        .store-label {
            cursor: pointer;
            font-size: 14px;
            color: #333;
        }
        
        .selected-stores {
            margin-top: 12px;
            padding: 12px;
            background: #e0e7ff;
            border-radius: 6px;
            min-height: 40px;
        }
        
        .selected-stores-label {
            font-size: 12px;
            font-weight: 600;
            color: #667eea;
            margin-bottom: 8px;
        }
        
        .selected-store-tag {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            margin: 4px 4px 4px 0;
        }
        
        .calculated {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin: 24px 0;
            text-align: center;
        }
        
        .calculated label {
            margin-bottom: 8px;
            color: #666;
        }
        
        .percentage-display {
            font-size: 48px;
            font-weight: 700;
            color: #667eea;
            margin-top: 8px;
        }
        
        .percentage-display.warning {
            color: #f59e0b;
        }
        
        .percentage-display.danger {
            color: #ef4444;
        }
        
        button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .history-section {
            padding: 0 30px 30px;
        }
        
        .history-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 16px;
            color: #333;
        }
        
        .history-grid {
            display: grid;
            gap: 12px;
        }
        
        .history-card {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 16px;
            border-radius: 8px;
        }
        
        .history-time {
            font-weight: 700;
            color: #667eea;
            margin-bottom: 8px;
            font-size: 16px;
        }
        
        .history-details {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
            font-size: 14px;
        }
        
        .history-detail {
            display: flex;
            flex-direction: column;
        }
        
        .history-label {
            color: #666;
            font-size: 12px;
            margin-bottom: 4px;
        }
        
        .history-value {
            font-weight: 600;
            color: #333;
        }
        
        .no-history {
            text-align: center;
            padding: 40px;
            color: #999;
        }
        
        .success-message {
            background: #10b981;
            color: white;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 600;
            display: none;
        }
        
        .success-message.show {
            display: block;
            animation: slideIn 0.3s ease-out;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @media (max-width: 640px) {
            .header h1 {
                font-size: 24px;
            }
            
            .percentage-display {
                font-size: 36px;
            }
            
            .history-details {
                grid-template-columns: 1fr;
                gap: 8px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Labor Tracker</h1>
            <p id="current-date"></p>
        </div>
        
        <div class="form-section">
            <div class="success-message" id="successMessage">
                ✓ Entry saved successfully!
            </div>
            
            <form id="laborForm">
                <div class="form-group">
                    <label>Select Store(s)</label>
                    <div class="store-selector" id="storeSelector">
                        <!-- Districts will be populated here -->
                    </div>
                    <div class="selected-stores">
                        <div class="selected-stores-label">Selected:</div>
                        <div id="selectedStoresTags"></div>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="checkTime">Check-in Time</label>
                    <select id="checkTime" required>
                        <option value="">Select time...</option>
                        <option value="1pm">1pm</option>
                        <option value="4pm">4pm</option>
                        <option value="7pm">7pm</option>
                        <option value="Close">Close</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="grossSales">Gross Sales ($)</label>
                    <input type="number" id="grossSales" step="0.01" min="0" required placeholder="0.00">
                </div>
                
                <div class="form-group">
                    <label for="laborDollars">Labor Dollars ($)</label>
                    <input type="number" id="laborDollars" step="0.01" min="0" required placeholder="0.00">
                </div>
                
                <div class="calculated">
                    <label>Gross Labor Percentage</label>
                    <div class="percentage-display" id="percentage">0.0%</div>
                </div>
                
                <button type="submit" id="submitBtn">Save Entry</button>
            </form>
        </div>
        
        <div class="history-section">
            <h2 class="history-title">Today's Entries</h2>
            <div class="history-grid" id="historyContainer">
                <div class="no-history">No entries yet for today</div>
            </div>
        </div>
    </div>
    
    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getFirestore, collection, addDoc, query, where, getDocs } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyCg6sdwxr788HymNLHF3skIro7P6SWrvHE",
            authDomain: "labor-tracker-bbbaa.firebaseapp.com",
            projectId: "labor-tracker-bbbaa",
            storageBucket: "labor-tracker-bbbaa.firebasestorage.app",
            messagingSenderId: "939951401620",
            appId: "1:939951401620:web:f2cd20c38c8e36a5466281"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        // Store data organized by district
        const districts = {
            "Benedict": [
                { id: "2444", name: "Richmond" },
                { id: "2524", name: "Palomar" },
                { id: "2842", name: "Georgetown" }
            ],
            "Faluconer": [
                { id: "2086", name: "Euclid" },
                { id: "2114", name: "Frankfort" },
                { id: "2294", name: "Sir Barton" },
                { id: "2521", name: "Tiverton" }
            ],
            "Maddox": [
                { id: "2274", name: "Hurstborne" },
                { id: "2546", name: "Preston" },
                { id: "2811", name: "Middletown" },
                { id: "2837", name: "Harley Center" }
            ],
            "Reid": [
                { id: "2098", name: "Summit" },
                { id: "2131", name: "Charlestown" },
                { id: "2431", name: "Poplar Level" },
                { id: "2641", name: "Dixie Hwy" },
                { id: "2731", name: "Veterans" },
                { id: "2880", name: "Wesley Commons" },
                { id: "3044", name: "Jeffersonville IN" },
                { id: "2166", name: "Carson" }
            ],
            "Spitznagel": [
                { id: "2021", name: "Breckenridge Ln" },
                { id: "2029", name: "Schuster" },
                { id: "2493", name: "Westport Village" },
                { id: "2632", name: "S 4th Street" },
                { id: "2713", name: "U OF L" },
                { id: "2753", name: "Blankenbaker" },
                { id: "2888", name: "Elizabethtown" },
                { id: "2937", name: "Jefferson Commons" }
            ]
        };
        
        // Track selected stores
        let selectedStores = new Set();
        
        // Display current date
        const dateElement = document.getElementById('current-date');
        const today = new Date();
        dateElement.textContent = today.toLocaleDateString('en-US', { 
            weekday: 'long', 
            year: 'numeric', 
            month: 'long', 
            day: 'numeric' 
        });
        
        // Build store selector
        function buildStoreSelector() {
            const selector = document.getElementById('storeSelector');
            selector.innerHTML = '';
            
            Object.keys(districts).forEach(districtName => {
                const districtSection = document.createElement('div');
                districtSection.className = 'district-section';
                
                // District header with checkbox
                const districtHeader = document.createElement('div');
                districtHeader.className = 'district-header';
                
                const districtCheckbox = document.createElement('input');
                districtCheckbox.type = 'checkbox';
                districtCheckbox.className = 'district-checkbox';
                districtCheckbox.id = `district-${districtName}`;
                
                const districtLabel = document.createElement('span');
                districtLabel.className = 'district-name';
                districtLabel.textContent = districtName;
                
                districtHeader.appendChild(districtCheckbox);
                districtHeader.appendChild(districtLabel);
                
                // District header click toggles all stores
                districtHeader.addEventListener('click', (e) => {
                    if (e.target !== districtCheckbox) {
                        districtCheckbox.checked = !districtCheckbox.checked;
                    }
                    toggleDistrict(districtName, districtCheckbox.checked);
                });
                
                // Store list
                const storeList = document.createElement('div');
                storeList.className = 'store-list';
                
                districts[districtName].forEach(store => {
                    const storeItem = document.createElement('div');
                    storeItem.className = 'store-item';
                    
                    const storeCheckbox = document.createElement('input');
                    storeCheckbox.type = 'checkbox';
                    storeCheckbox.className = 'store-checkbox';
                    storeCheckbox.id = `store-${store.id}`;
                    storeCheckbox.dataset.storeId = store.id;
                    storeCheckbox.dataset.storeName = store.name;
                    storeCheckbox.dataset.district = districtName;
                    
                    const storeLabel = document.createElement('label');
                    storeLabel.className = 'store-label';
                    storeLabel.htmlFor = `store-${store.id}`;
                    storeLabel.textContent = `${store.id} - ${store.name}`;
                    
                    storeCheckbox.addEventListener('change', (e) => {
                        toggleStore(store.id, store.name, e.target.checked);
                        updateDistrictCheckbox(districtName);
                    });
                    
                    storeItem.appendChild(storeCheckbox);
                    storeItem.appendChild(storeLabel);
                    storeList.appendChild(storeItem);
                });
                
                districtSection.appendChild(districtHeader);
                districtSection.appendChild(storeList);
                selector.appendChild(districtSection);
            });
        }
        
        // Toggle entire district
        function toggleDistrict(districtName, checked) {
            districts[districtName].forEach(store => {
                const checkbox = document.getElementById(`store-${store.id}`);
                if (checkbox) {
                    checkbox.checked = checked;
                    toggleStore(store.id, store.name, checked);
                }
            });
        }
        
        // Update district checkbox based on store selections
        function updateDistrictCheckbox(districtName) {
            const storesInDistrict = districts[districtName];
            const selectedInDistrict = storesInDistrict.filter(store => 
                selectedStores.has(`${store.id} - ${store.name}`)
            ).length;
            
            const districtCheckbox = document.getElementById(`district-${districtName}`);
            if (districtCheckbox) {
                districtCheckbox.checked = selectedInDistrict === storesInDistrict.length;
                districtCheckbox.indeterminate = selectedInDistrict > 0 && selectedInDistrict < storesInDistrict.length;
            }
        }
        
        // Toggle individual store
        function toggleStore(id, name, checked) {
            const storeKey = `${id} - ${name}`;
            if (checked) {
                selectedStores.add(storeKey);
            } else {
                selectedStores.delete(storeKey);
            }
            updateSelectedStoresTags();
        }
        
        // Update selected stores display
        function updateSelectedStoresTags() {
            const tagsContainer = document.getElementById('selectedStoresTags');
            if (selectedStores.size === 0) {
                tagsContainer.innerHTML = '<span style="color: #999; font-size: 13px;">None selected</span>';
            } else {
                tagsContainer.innerHTML = Array.from(selectedStores)
                    .map(store => `<span class="selected-store-tag">${store}</span>`)
                    .join('');
            }
            
            // Enable/disable submit button
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = selectedStores.size === 0;
        }
        
        // Form elements
        const form = document.getElementById('laborForm');
        const checkTimeSelect = document.getElementById('checkTime');
        const grossSalesInput = document.getElementById('grossSales');
        const laborDollarsInput = document.getElementById('laborDollars');
        const percentageDisplay = document.getElementById('percentage');
        const successMessage = document.getElementById('successMessage');
        const historyContainer = document.getElementById('historyContainer');
        
        // Calculate percentage on input
        function calculatePercentage() {
            const sales = parseFloat(grossSalesInput.value) || 0;
            const labor = parseFloat(laborDollarsInput.value) || 0;
            
            if (sales > 0) {
                const percentage = (labor / sales) * 100;
                percentageDisplay.textContent = percentage.toFixed(1) + '%';
                
                percentageDisplay.classList.remove('warning', 'danger');
                if (percentage > 35) {
                    percentageDisplay.classList.add('danger');
                } else if (percentage > 30) {
                    percentageDisplay.classList.add('warning');
                }
            } else {
                percentageDisplay.textContent = '0.0%';
                percentageDisplay.classList.remove('warning', 'danger');
            }
        }
        
        grossSalesInput.addEventListener('input', calculatePercentage);
        laborDollarsInput.addEventListener('input', calculatePercentage);
        
        // Get today's date string
        function getTodayDateString() {
            return new Date().toISOString().split('T')[0];
        }
        
        // Load entries for today
        async function loadTodaysEntries() {
            try {
                const todayDate = getTodayDateString();
                
                let q = query(
                    collection(db, 'labor_entries'),
                    where('date', '==', todayDate)
                );
                
                // Filter by selected stores if any
                if (selectedStores.size > 0) {
                    const storeArray = Array.from(selectedStores);
                    q = query(
                        collection(db, 'labor_entries'),
                        where('date', '==', todayDate),
                        where('stores', 'array-contains-any', storeArray.slice(0, 10)) // Firestore limit
                    );
                }
                
                const querySnapshot = await getDocs(q);
                const entries = [];
                querySnapshot.forEach((doc) => {
                    entries.push(doc.data());
                });
                
                if (entries.length === 0) {
                    historyContainer.innerHTML = '<div class="no-history">No entries yet for today</div>';
                    return;
                }
                
                historyContainer.innerHTML = entries
                    .sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp))
                    .map(entry => {
                        const time = new Date(entry.timestamp).toLocaleTimeString('en-US', {
                            hour: 'numeric',
                            minute: '2-digit'
                        });
                        
                        const storesDisplay = entry.stores.join(', ');
                        
                        return `
                            <div class="history-card">
                                <div class="history-time">${entry.checkTime} Check - ${time}</div>
                                <div style="margin-bottom: 12px; color: #667eea; font-size: 13px;">
                                    ${storesDisplay}
                                </div>
                                <div class="history-details">
                                    <div class="history-detail">
                                        <span class="history-label">Gross Sales</span>
                                        <span class="history-value">$${parseFloat(entry.grossSales).toFixed(2)}</span>
                                    </div>
                                    <div class="history-detail">
                                        <span class="history-label">Labor</span>
                                        <span class="history-value">$${parseFloat(entry.laborDollars).toFixed(2)}</span>
                                    </div>
                                    <div class="history-detail">
                                        <span class="history-label">Labor %</span>
                                        <span class="history-value">${entry.percentage}%</span>
                                    </div>
                                </div>
                            </div>
                        `;
                    }).join('');
            } catch (error) {
                console.error('Error loading entries:', error);
                historyContainer.innerHTML = '<div class="no-history">Error loading entries. Please refresh.</div>';
            }
        }
        
        // Form submission
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            if (selectedStores.size === 0) {
                alert('Please select at least one store');
                return;
            }
            
            const sales = parseFloat(grossSalesInput.value);
            const labor = parseFloat(laborDollarsInput.value);
            const percentage = ((labor / sales) * 100).toFixed(1);
            
            const entry = {
                stores: Array.from(selectedStores),
                checkTime: checkTimeSelect.value,
                grossSales: sales,
                laborDollars: labor,
                percentage: percentage,
                timestamp: new Date().toISOString(),
                date: getTodayDateString()
            };
            
            try {
                await addDoc(collection(db, 'labor_entries'), entry);
                
                successMessage.classList.add('show');
                setTimeout(() => {
                    successMessage.classList.remove('show');
                }, 3000);
                
                checkTimeSelect.value = '';
                grossSalesInput.value = '';
                laborDollarsInput.value = '';
                percentageDisplay.textContent = '0.0%';
                percentageDisplay.classList.remove('warning', 'danger');
                
                loadTodaysEntries();
            } catch (error) {
                console.error('Error saving entry:', error);
                alert('Error saving entry. Please try again.');
            }
        });
        
        // Initialize
        buildStoreSelector();
        updateSelectedStoresTags();
        loadTodaysEntries();
    </script>
</body>
</html>
